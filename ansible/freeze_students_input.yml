---
- name: Toggle freeze / unfreeze student computers (input only)
  hosts: students
  become: true
  gather_facts: false

  vars:
    student_user: "student"
    state_dir: "/run/cyberlab"
    marker_file: "/run/cyberlab/input_frozen"

  tasks:
    - name: Ensure cyberlab state dir exists
      ansible.builtin.file:
        path: "{{ state_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check current freeze state
      ansible.builtin.stat:
        path: "{{ marker_file }}"
      register: freeze_marker

    - name: Set is_frozen fact for this host
      ansible.builtin.set_fact:
        is_frozen: "{{ freeze_marker.stat.exists }}"

    - name: Calculate majority state across all online hosts
      run_once: true
      ansible.builtin.set_fact:
        global_frozen_count: "{{ ansible_play_hosts | map('extract', hostvars, 'is_frozen') | select | list | length }}"
        global_total_count: "{{ ansible_play_hosts | length }}"

    - name: Decide global action based on majority
      run_once: true
      ansible.builtin.set_fact:
        global_action: "{{ 'unfreeze' if (global_frozen_count | int > (global_total_count | int) / 2) else 'freeze' }}"

    - name: Propagate global action to all hosts
      ansible.builtin.set_fact:
        freeze_state: "{{ hostvars[ansible_play_hosts[0]]['global_action'] }}"

    - name: Debug toggle decision
      ansible.builtin.debug:
        msg: "Global decision -> {{ freeze_state | upper }} ({{ hostvars[ansible_play_hosts[0]]['global_frozen_count'] }}/{{ hostvars[ansible_play_hosts[0]]['global_total_count'] }} online PCs were frozen)"

    - name: Unfreeze (kill xtrlock)
      ansible.builtin.command: killall xtrlock
      failed_when: false
      when: freeze_state == 'unfreeze'

    - name: Remove freeze marker
      ansible.builtin.file:
        path: "{{ marker_file }}"
        state: absent
      when: freeze_state == 'unfreeze'

    - name: Get DISPLAY for X11 session
      ansible.builtin.shell: |
        who | awk -v u="{{ student_user }}" '$1==u && $2 ~ /^:/ {print $2}' | head -n1
      register: display_cmd
      changed_when: false
      when: freeze_state == 'freeze'

    - name: Set DISPLAY fact
      ansible.builtin.set_fact:
        display_var: "{{ display_cmd.stdout | trim if display_cmd.stdout | trim != '' else ':0' }}"
      when: freeze_state == 'freeze'

    - name: Freeze (start xtrlock)
      ansible.builtin.shell: |
        export DISPLAY="{{ display_var }}"
        export XAUTHORITY="/run/user/$(id -u {{ student_user }})/gdm/Xauthority"
        if [ ! -f "$XAUTHORITY" ]; then export XAUTHORITY="/home/{{ student_user }}/.Xauthority"; fi
        # Kill any existing xtrlock first to prevent duplicates
        killall xtrlock || true
        # Start xtrlock in the background
        nohup xtrlock </dev/null >/dev/null 2>&1 &
      when: freeze_state == 'freeze'

    - name: Write freeze marker
      ansible.builtin.copy:
        dest: "{{ marker_file }}"
        content: "frozen\n"
      when: freeze_state == 'freeze'
