---
- name: Toggle freeze / unfreeze student computers (Fast Version)
  hosts: students
  become: true
  gather_facts: false

  vars:
    student_user: "student"
    state_dir: "/run/cyberlab"
    marker_file: "/run/cyberlab/input_frozen"

  tasks:
    - name: Gather state and display in one shot
      ansible.builtin.shell: |
        mkdir -p "{{ state_dir }}"
        chmod 0755 "{{ state_dir }}"
        
        if [ -f "{{ marker_file }}" ]; then
          echo "FROZEN=true"
        else
          echo "FROZEN=false"
        fi
        
        DISP=$(who | awk -v u="{{ student_user }}" '$1==u && $2 ~ /^:/ {print $2}' | head -n1)
        if [ -z "$DISP" ]; then DISP=":0"; fi
        echo "DISPLAY=$DISP"
      register: host_state
      changed_when: false

    - name: Parse host state
      ansible.builtin.set_fact:
        is_frozen: "{{ 'FROZEN=true' in host_state.stdout }}"
        display_var: "{{ host_state.stdout | regex_search('DISPLAY=(.*)', '\\1') | first }}"

    - name: Calculate majority state across all online hosts
      run_once: true
      ansible.builtin.set_fact:
        global_frozen_count: "{{ ansible_play_hosts | map('extract', hostvars, 'is_frozen') | select | list | length }}"
        global_total_count: "{{ ansible_play_hosts | length }}"

    - name: Decide global action based on majority
      run_once: true
      ansible.builtin.set_fact:
        global_action: "{{ force_action if force_action is defined else ('unfreeze' if (global_frozen_count | int > (global_total_count | int) / 2) else 'freeze') }}"

    - name: Propagate global action to all hosts
      ansible.builtin.set_fact:
        freeze_state: "{{ hostvars[ansible_play_hosts[0]]['global_action'] }}"

    - name: Execute Unfreeze
      ansible.builtin.shell: |
        killall xtrlock || true
        export DISPLAY="{{ display_var }}"
        export XAUTHORITY="/run/user/$(id -u {{ student_user }})/gdm/Xauthority"
        if [ ! -f "$XAUTHORITY" ]; then export XAUTHORITY="/home/{{ student_user }}/.Xauthority"; fi
        setxkbmap -option
        for id in $(xinput list | grep -i 'floating slave' | sed -n 's/.*id=\([0-9]*\).*/\1/p'); do
          xinput reattach $id 2 2>/dev/null || xinput reattach $id 3 2>/dev/null || true
        done
        rm -f "{{ marker_file }}"
      when: freeze_state == 'unfreeze'

    - name: Execute Freeze
      ansible.builtin.shell: |
        export DISPLAY="{{ display_var }}"
        export XAUTHORITY="/run/user/$(id -u {{ student_user }})/gdm/Xauthority"
        if [ ! -f "$XAUTHORITY" ]; then export XAUTHORITY="/home/{{ student_user }}/.Xauthority"; fi
        setxkbmap -option srvrkeys:none
        for id in $(xinput list | grep -iE 'slave.*pointer|slave.*keyboard' | grep -v XTEST | sed -n 's/.*id=\([0-9]*\).*/\1/p'); do
          xinput float $id || true
        done
        killall xtrlock || true
        nohup bash -c 'for i in {1..120}; do xtrlock </dev/null >/dev/null 2>&1; rc=$?; if [ $rc -ne 1 ]; then break; fi; sleep 1; done' >/dev/null 2>&1 &
        echo "frozen" > "{{ marker_file }}"
      when: freeze_state == 'freeze'
