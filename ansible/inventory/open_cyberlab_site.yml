---
- name: Open CyberLab site in Firefox (Optimized)
  hosts: students
  become: true
  gather_facts: false

  vars:
    student_user: student
    site_url: "https://cybersecurity.local/"

  tasks:
    - name: Launch Firefox portal using single optimized bash block
      ansible.builtin.shell: |
        set -e
        USER="{{ student_user }}"
        SITE="{{ site_url }}"
        UID_NUM=$(id -u "$USER" || echo "")
        
        if [ -z "$UID_NUM" ]; then
            echo "User $USER not found."
            exit 1
        fi

        # Detect Firefox
        if command -v snap >/dev/null 2>&1 && snap list 2>/dev/null | awk '{print $1}' | grep -qx firefox; then
            FIREFOX_CMD="snap run firefox"
        elif command -v firefox >/dev/null 2>&1; then
            FIREFOX_CMD="firefox"
        elif [ -x /usr/bin/firefox ]; then
            FIREFOX_CMD="/usr/bin/firefox"
        else
            echo "Firefox not found."
            exit 1
        fi

        # Kill existing
        pkill -u "$USER" -f "firefox" || true
        pkill -u "$USER" -f "snap.*firefox" || true
        sleep 0.5

        GNOME_PID=$(pgrep -u "$USER" gnome-shell | head -n1)
        if [ -z "$GNOME_PID" ]; then
            echo "gnome-shell not running for student."
            exit 0
        fi

        # Check DBus
        BUS_PATH="/run/user/$UID_NUM/bus"
        if [ ! -S "$BUS_PATH" ]; then
            echo "No DBus session found."
            exit 0
        fi

        WAYLAND_SOCK=$(ls -1 /run/user/$UID_NUM/wayland-* 2>/dev/null | head -n 1 || true)
        
        if [ -n "$WAYLAND_SOCK" ]; then
            # Wayland
            su - "$USER" -c "XDG_RUNTIME_DIR=/run/user/$UID_NUM DBUS_SESSION_BUS_ADDRESS=unix:path=$BUS_PATH WAYLAND_DISPLAY=$(basename $WAYLAND_SOCK) MOZ_ENABLE_WAYLAND=1 MOZ_USE_XINPUT2=1 setsid -f $FIREFOX_CMD '$SITE' >/dev/null 2>&1 </dev/null"
        else
            # X11 Fallback
            export DISPLAY=$(cat /proc/$GNOME_PID/environ | tr '\0' '\n' | grep '^DISPLAY=' | cut -d= -f2)
            if [ -z "$DISPLAY" ]; then export DISPLAY=:0; fi

            export XAUTHORITY=$(cat /proc/$GNOME_PID/environ | tr '\0' '\n' | grep '^XAUTHORITY=' | cut -d= -f2)
            if [ -z "$XAUTHORITY" ]; then export XAUTHORITY=/run/user/$UID_NUM/gdm/Xauthority; fi
            
            su - "$USER" -c "DISPLAY=$DISPLAY XAUTHORITY=$XAUTHORITY setsid -f $FIREFOX_CMD '$SITE' >/dev/null 2>&1 </dev/null"
        fi
      args:
        executable: /bin/bash
      changed_when: false
